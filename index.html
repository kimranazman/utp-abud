<!DOCTYPE html>
<html lang="en" prefix="og: http://ogp.me/ns#">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security Headers (CSP and Referrer-Policy can be set via meta tags) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://api.utpalumni.org https://api.mapbox.com https://js.stripe.com blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://api.mapbox.com; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.utpalumni.org wss://api.utpalumni.org https://api.mapbox.com https://events.mapbox.com; base-uri 'self'; form-action 'self';" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <!-- Other security headers (X-Frame-Options, X-Content-Type-Options, X-XSS-Protection, Permissions-Policy) are set via HTTP headers in vercel.json and public/_headers -->

    <!-- Cache Control -->
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="pragma" content="no-cache" />
    <meta http-equiv="expires" content="0" />

    <link rel="icon" type="image/png" sizes="16x16" href="/abud/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/abud/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/abud/apple-touch-icon.png" />
